[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phonelint"
version = "0.1.0"
description = "Carrier, line type and block allocation for phone numbers, on top of libphonenumber"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Phonelint" }]
keywords = ["phone", "telephone", "carrier", "line-type", "numbering-plan",
            "libphonenumber", "validation", "ofcom", "msisdn"]
dependencies = ["phonenumbers>=8.13"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Telephony",
]

[project.urls]
Homepage = "https://phonelint.com"
Source = "https://github.com/phonelint/phonelint-py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phonelint = ["_data/*.db"]

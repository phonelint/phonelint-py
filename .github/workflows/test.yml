name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor pyproject claims, through the current release. If a row
        # here fails, requires-python is wrong -- fix one or the other rather
        # than deleting the row.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Test
        run: pytest -q
      - name: Check the bundled dataset actually shipped
        # src-layout plus package-data is easy to get subtly wrong, and the
        # failure mode is a package that imports fine and then answers nothing.
        run: |
          python - <<'PY'
          import phonelint
          c = phonelint.coverage()
          assert c, "no dataset bundled: %r" % (c,)
          n = sum(c.values())
          assert n > 300000, "dataset looks truncated: %d prefixes" % n
          print("dataset OK:", c)
          PY
